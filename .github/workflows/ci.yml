name: Continuous Integration
on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  # See: https://github.community/t/duplicate-checks-on-push-and-pull-request-simultaneous-event/18012
  push:
    branches:
      - master*
  pull_request:
    branches:
      - master*

jobs:
  build:
    name: Full Build (node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [24.x]
      # https://stackoverflow.com/questions/61070925/github-actions-disable-auto-cancel-when-job-fails
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ci

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Build example
        run: npm run compile
        working-directory: example

      - name: Install WebSocket example dependencies
        run: npm ci
        working-directory: example-ws

      - name: Build WebSocket example
        run: npm run compile
        working-directory: example-ws

      - name: Lint WebSocket example
        run: npm run lint
        working-directory: example-ws
